name: Temporary MIX Volume Browser Smoke
on:
  push:
    branches: [feat/web-native-mix-volume-20261009]
    paths:
      - 'web/dist/choochootracker.wasm'
      - 'web/dist/choochootracker.js'
      - '.github/workflows/mix-volume-browser.yml'
permissions:
  contents: read
jobs:
  native-volume-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm compiled bridge and source consistency
        run: |
          cmp web/wroom.js web/dist/wroom.js
          cmp web/wroom.css web/dist/wroom.css
          cmp web/index.html web/dist/index.html
          node web/wasm_bridge_contract_test.mjs
      - name: Install Chrome driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Run Web MIX volume + pan against compiled WebAssembly
        env:
          LIVE_URL: http://127.0.0.1:8765/
          EXPECTED_BUILD: volume-pr-preview
        run: |
          sed -i 's/__WROOM_BUILD__/volume-pr-preview/g' web/dist/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web/dist >/tmp/wroom-volume-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node web/live_pages_smoke.mjs
          node web/live_pages_layout_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mix-volume-browser-proof-${{ github.sha }}
          path: artifacts/live-pages-smoke/
          if-no-files-found: warn
# Browser smoke is triggered after the compiled WASM bundle is committed.
# Rerun after fixing tab binding; no recompile required.
# Check semantic MIX visibility after CSS cleanup.
# Recheck strict-locator correction for direct MIX fallback.
# Rerun after mobile 360px track-slider layout tightening.
