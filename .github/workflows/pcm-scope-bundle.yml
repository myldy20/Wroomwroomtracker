name: Temporary PR PCM Scope Bundle
on:
  pull_request:
    branches: [main]
    paths:
      - 'tracker/src/app.cpp'
      - 'web/wroom.js'
      - 'web/wasm_bridge_contract_test.mjs'
      - '.github/workflows/pcm-scope-bundle.yml'
permissions:
  contents: write
concurrency:
  group: pcm-scope-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  compile-and-save:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Compile checked-in WASM for this PR branch only
        run: |
          make -C tracker -j2 -f Makefile.web web-deploy \
            COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          grep -Fq 'webTrackAudioScopeHex' web/dist/choochootracker.js
          cmp web/wroom.js web/dist/wroom.js
          cmp web/wroom.css web/dist/wroom.css
      - name: Commit updated generated bundle to PR branch, never main
        run: |
          if git diff --quiet -- web/dist; then
            echo "Generated bundle already up to date"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/dist
          git commit -m "build(web): compile native PCM scope bridge for PR"
          git push origin "HEAD:${{ github.head_ref }}"
