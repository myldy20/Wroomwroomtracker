name: Temporary MIX Volume PR Build
on:
  push:
    branches: [feat/web-native-mix-volume-20261009]
    paths:
      - 'tracker/src/app.cpp'
      - 'web/wroom.js'
      - 'web/wroom.css'
      - 'web/index.html'
      - 'web/wasm_bridge_contract_test.mjs'
      - '.github/workflows/mix-volume-bundle.yml'
  pull_request:
    branches: [feat/web-native-mix-pan-20261009]
    paths:
      - 'tracker/src/app.cpp'
      - 'web/wroom.js'
      - 'web/wasm_bridge_contract_test.mjs'
      - '.github/workflows/mix-volume-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mix-volume-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false
jobs:
  build-check-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-native-mix-volume-20261009
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Compile native MIX bridge and verify exports
        run: |
          make -C tracker -j2 -f Makefile.web web-deploy COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          grep -Fq 'webMixTrackVolume' web/dist/choochootracker.js
          grep -Fq 'webMixSetTrackVolume' web/dist/choochootracker.js
          node web/wasm_bridge_contract_test.mjs
          node web/song_semantic_contract_test.mjs
          node --check web/wroom.js
          cmp web/wroom.js web/dist/wroom.js
          cmp web/wroom.css web/dist/wroom.css
          cmp web/index.html web/dist/index.html
      - name: Save generated build only on MIX volume feature branch
        run: |
          if git diff --quiet -- web/dist; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/dist
          git commit -m "build(web): compile native volume and pan bridge"
          git push origin HEAD:feat/web-native-mix-volume-20261009
