name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: make -C tracker -f Makefile.test -j4

  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check checked-in Web entry point
        run: |
          cmp web/index.html web/dist/index.html
          cmp web/wroom.css web/dist/wroom.css
          cmp web/wroom.js web/dist/wroom.js
          node --check web/wroom.js
          grep -Fq '<canvas id="canvas"' web/index.html
          ! grep -Eq '^WEB_CFLAGS.*DESKTOP_BUILD' tracker/Makefile.web
          ! grep -Eq '(^|[^$])\$\("\[data-file-action\]"\)\.forEach' web/wroom.js
          ! grep -Eq '(^|[^$])\$\("\[data-menu-screen\]"\)\.forEach' web/wroom.js

  web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Build browser bundle
        run: |
          make -C tracker -j2 -f Makefile.web web-deploy \
            COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          test -s web/dist/choochootracker.js
          test -s web/dist/choochootracker.wasm
          cmp web/index.html web/dist/index.html
          cmp web/wroom.css web/dist/wroom.css
          cmp web/wroom.js web/dist/wroom.js
