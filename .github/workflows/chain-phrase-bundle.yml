name: Temporary Chain Phrase WASM Bundle
on:
  push:
    branches: [feat/web-direct-chain-phrase-20261009]
    paths:
      - '.github/workflows/chain-phrase-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chain-phrase-build
  cancel-in-progress: false
jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-direct-chain-phrase-20261009
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Build canonical native Chain and Phrase exports
        run: |
          make -C tracker -j2 -f Makefile.web web-deploy COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          node --check web/wroom.js
          node web/native_parity_contract_test.mjs
          node web/wasm_bridge_contract_test.mjs
          cmp web/wroom.js web/dist/wroom.js
          cmp web/wroom.css web/dist/wroom.css
          cmp web/index.html web/dist/index.html
      - name: Commit generated WebAssembly only on feature branch
        run: |
          if git diff --quiet -- web/dist; then
            echo "Generated bundle already matches sources"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/dist
          git commit -m "build(web): compile native Chain and Phrase bridge"
          git fetch origin feat/web-direct-chain-phrase-20261009
          git rebase origin/feat/web-direct-chain-phrase-20261009
          git push origin HEAD:feat/web-direct-chain-phrase-20261009
