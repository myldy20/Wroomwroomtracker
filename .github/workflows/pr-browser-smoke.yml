name: PR Browser Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The checked-in bundle belongs to main and may not contain upstream changes.
      # Browser smoke must use the actual WASM built from this PR source.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Rebuild this PR's WebAssembly bundle
        run: |
          make -C tracker -j2 -f Makefile.web web-deploy \\
            COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          test -s web/dist/choochootracker.wasm
          test -s web/dist/choochootracker.js
      - name: Verify generated WASM bridge exports
        run: |
          node web/wasm_bridge_contract_test.mjs
          cmp web/wroom.js web/dist/wroom.js
          cmp web/wroom.css web/dist/wroom.css
      - name: Locate system Chrome and install driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Exercise compiled PR bundle before deployment
        env:
          LIVE_URL: http://127.0.0.1:8765/
          EXPECTED_BUILD: pr-preview
        run: |
          sed -i 's/__WROOM_BUILD__/pr-preview/g' web/dist/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web/dist > /tmp/wroom-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          node web/live_pages_smoke.mjs
          node web/live_pages_layout_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-browser-smoke-${{ github.sha }}
          path: artifacts/live-pages-smoke/
          if-no-files-found: warn
