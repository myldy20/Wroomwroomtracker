name: Web

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - web/restore-native-track-monitor-20261008
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: web-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Build Web bundle
        run: |
          em++ --version
          make -C tracker -j2 -f Makefile.web web-deploy \
            COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
      - name: Commit generated Web bundle
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- web/dist; then
            echo "web/dist is already up to date"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/dist
          git commit -m "build: update web bundle"
          if [ "$GITHUB_REF" = "refs/heads/web/restore-native-track-monitor-20261008" ]; then
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: choochootracker-web
          path: web/dist/
          if-no-files-found: error
