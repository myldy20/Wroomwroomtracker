name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Build Web bundle
        run: |
          em++ --version
          make -C tracker -j2 -f Makefile.web web-deploy \
            COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          sed -i "s/__WROOM_BUILD__/${GITHUB_SHA}/g" web/dist/index.html
          grep -Fq "wroom.js?v=${GITHUB_SHA}" web/dist/index.html
          grep -Fq "wroom.css?v=${GITHUB_SHA}" web/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
