name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
      - name: Build Web bundle
        run: |
          em++ --version
          make -C tracker -j2 -f Makefile.web web-deploy \
            COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST'
          sed -i "s/__WROOM_BUILD__/${GITHUB_SHA}/g" web/dist/index.html
          grep -Fq "wroom.js?v=${GITHUB_SHA}" web/dist/index.html
          grep -Fq "wroom.css?v=${GITHUB_SHA}" web/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify live Pages startup
    runs-on: ubuntu-24.04
    needs: deploy
    env:
      LIVE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium executable found on runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1

      - name: Exercise deployed app in real browser
        run: node web/live_pages_smoke.mjs

      - name: Upload live-start diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-smoke-${{ github.sha }}
          path: artifacts/live-pages-smoke/
          if-no-files-found: warn
